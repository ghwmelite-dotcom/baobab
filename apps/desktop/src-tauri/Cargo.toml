[package]
name = "baobab-desktop"
version = "0.0.1"
description = "Baobab — The African AI Browser"
license = "AGPL-3.0"
edition = "2021"

[lib]
name = "baobab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
