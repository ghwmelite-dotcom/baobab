# Linker for the GNU target on Windows.
# This config is a no-op for other platforms (they never resolve to this target),
# so it's safe to commit. To actually USE the GNU target on a dev box without
# MSVC, set CARGO_BUILD_TARGET=x86_64-pc-windows-gnu in your shell profile, or
# pass --target x86_64-pc-windows-gnu to cargo. See plan_deviations.md.

[target.x86_64-pc-windows-gnu]
linker = "C:/msys64/mingw64/bin/x86_64-w64-mingw32-gcc.exe"
