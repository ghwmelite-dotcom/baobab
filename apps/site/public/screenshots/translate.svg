  <rect x="312" y="424" width="120" height="32" rx="8" fill="#15110d" stroke="#3a3127"/>
  <text x="328" y="445" fill="#f0e9dc" font-family="Georgia, serif" font-size="13">Yorùbá ▾</text>
  <rect x="312" y="466" width="656" height="120" rx="10" fill="#221a14" stroke="#3a3127"/>
  <text x="332" y="496" fill="#f0e9dc" font-family="Georgia, serif" font-size="15" font-style="italic">Ibo wo ni ilé-ìwòsàn tó sún mọ́ ibí jù lọ tó gbà</text>
  <text x="332" y="520" fill="#f0e9dc" font-family="Georgia, serif" font-size="15" font-style="italic">Iṣẹ́-ìṣòwò Ìlera ti Orílẹ̀-Èdè?</text>
