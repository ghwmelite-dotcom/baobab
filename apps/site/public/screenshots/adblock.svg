<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-label="Baobab Settings - Ad-blocker section with stats and refresh">
  <defs>
    <linearGradient id="adBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1814"/>
      <stop offset="1" stop-color="#15110d"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="800" fill="url(#adBg)"/>
  <!-- chrome -->
  <rect x="0" y="0" width="1280" height="48" fill="#15110d"/>
  <rect x="0" y="47" width="1280" height="1" fill="#3a3127"/>
  <text x="24" y="29" fill="#f0e9dc" font-family="Georgia, serif" font-size="14" font-weight="700">baobab</text>
  <text x="120" y="29" fill="#b8ad9a" font-family="Georgia, serif" font-size="12">Settings · Ad-blocker</text>
  <!-- sidebar -->
  <rect x="0" y="48" width="240" height="752" fill="#1c1814"/>
  <rect x="240" y="48" width="1" height="752" fill="#3a3127"/>
  <g font-family="Georgia, serif" font-size="13" fill="#b8ad9a">
    <text x="24" y="92">Profile</text>
    <text x="24" y="122">Privacy</text>
    <text x="24" y="152">Data</text>
    <text x="24" y="182">Sovereignty</text>
  </g>
  <rect x="0" y="200" width="240" height="36" fill="rgba(217,119,6,0.1)"/>
  <rect x="0" y="200" width="3" height="36" fill="#d97706"/>
  <text x="24" y="222" fill="#d97706" font-family="Georgia, serif" font-size="13" font-weight="700">Ad-blocker</text>
  <g font-family="Georgia, serif" font-size="13" fill="#b8ad9a">
    <text x="24" y="262">AI sidebar</text>
    <text x="24" y="292">Reader</text>
    <text x="24" y="322">About</text>
  </g>
  <!-- main panel -->
  <text x="288" y="100" fill="#f0e9dc" font-family="Georgia, serif" font-size="26" font-weight="700">Ad-blocker</text>
  <text x="288" y="128" fill="#b8ad9a" font-family="Georgia, serif" font-size="14">Network-layer blocking + DOM mutation observers. YouTube fast-forward.</text>
  <!-- toggle card -->
  <rect x="288" y="160" width="940" height="80" rx="12" fill="#1c1814" stroke="#3a3127"/>
  <text x="320" y="195" fill="#f0e9dc" font-family="Georgia, serif" font-size="16" font-weight="700">Block ads + trackers on this profile</text>
  <text x="320" y="220" fill="#b8ad9a" font-family="Georgia, serif" font-size="12">103 hosts on the starter list. EasyList + EasyPrivacy.</text>
  <!-- toggle pill -->
  <rect x="1150" y="190" width="56" height="28" rx="14" fill="#d97706"/>
  <circle cx="1190" cy="204" r="11" fill="#15110d"/>
  <!-- stats grid -->
  <g transform="translate(288, 264)">
    <text x="0" y="0" fill="#7a7060" font-family="Georgia, serif" font-size="11" font-weight="700" letter-spacing="2">THIS WEEK</text>
    <g transform="translate(0, 24)">
      <rect x="0" y="0" width="296" height="120" rx="10" fill="#1c1814" stroke="#3a3127"/>
      <text x="22" y="36" fill="#7a7060" font-family="Georgia, serif" font-size="12">Trackers blocked</text>
      <text x="22" y="80" fill="#d97706" font-family="Georgia, serif" font-size="42" font-weight="700">2,488</text>
      <text x="22" y="106" fill="#b8ad9a" font-family="Georgia, serif" font-size="11">+18% vs last week</text>
    </g>
    <g transform="translate(322, 24)">
      <rect x="0" y="0" width="296" height="120" rx="10" fill="#1c1814" stroke="#3a3127"/>
      <text x="22" y="36" fill="#7a7060" font-family="Georgia, serif" font-size="12">Data saved (ad payload est.)</text>
      <text x="22" y="80" fill="#a8c79a" font-family="Georgia, serif" font-size="42" font-weight="700">31.2 MB</text>
      <text x="22" y="106" fill="#b8ad9a" font-family="Georgia, serif" font-size="11">~ N12 on a 4G plan</text>
    </g>
    <g transform="translate(644, 24)">
      <rect x="0" y="0" width="296" height="120" rx="10" fill="#1c1814" stroke="#3a3127"/>
      <text x="22" y="36" fill="#7a7060" font-family="Georgia, serif" font-size="12">YouTube ads skipped</text>
      <text x="22" y="80" fill="#c89876" font-family="Georgia, serif" font-size="42" font-weight="700">147</text>
      <text x="22" y="106" fill="#b8ad9a" font-family="Georgia, serif" font-size="11">Avg 18s saved each</text>
    </g>
  </g>
  <!-- list source -->
  <text x="288" y="480" fill="#7a7060" font-family="Georgia, serif" font-size="11" font-weight="700" letter-spacing="2">LIST SOURCE</text>
  <text x="288" y="510" fill="#f0e9dc" font-family="Georgia, serif" font-size="14">EasyList + EasyPrivacy starter — 103 hosts</text>
  <text x="288" y="532" fill="#b8ad9a" font-family="Georgia, serif" font-size="12">Last refreshed 2 days ago · Auto-refreshes weekly</text>
  <rect x="1080" y="494" width="148" height="36" rx="18" fill="#1c1814" stroke="#d97706"/>
  <text x="1154" y="517" text-anchor="middle" fill="#d97706" font-family="Georgia, serif" font-size="13" font-weight="700">Refresh now</text>
</svg>
