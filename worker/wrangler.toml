name = "baobab-api"
main = "src/index.ts"
compatibility_date = "2026-05-02"
compatibility_flags = ["nodejs_compat"]
account_id = "f4f236a6cd8fbddf397c6e9de17d8113"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "baobab-db"
database_id = "a32067a4-238c-48f0-ba85-e691cd9ac8fd"
migrations_dir = "db/migrations"

[[kv_namespaces]]
binding = "SESSIONS"
id = "31a996a5bc6142d0889425907771424e"

[[kv_namespaces]]
binding = "PAGE_CACHE"
id = "23c86a3a82e742dabab89694f8528fdc"

[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "a26136c4fdf1494db92e400498fdd7ea"

[[kv_namespaces]]
binding = "OFFLINE_INDEX"
id = "2e010b42abbe4707a84b18bab26d69f1"

[[kv_namespaces]]
binding = "OTP"
id = "08f9fc65b5254b81a99d3294b9b0a1d7"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "baobab-assets"
jurisdiction = "eu"

[[r2_buckets]]
binding = "OFFLINE"
bucket_name = "baobab-offline"
jurisdiction = "eu"

[[durable_objects.bindings]]
name = "READER_QUEUE"
class_name = "ReaderQueue"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ReaderQueue"]

# SENTRY_DSN is intentionally blank in vars. In production, set the real DSN
# as a secret via: wrangler secret put SENTRY_DSN
[vars]
ENVIRONMENT = "development"
APP_NAME = "Baobab"
APP_VERSION = "0.0.1"
CORS_ORIGIN = "http://localhost:5173,http://localhost:8080,http://localhost:1420,tauri://localhost"
SENTRY_DSN = ""
DEFAULT_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
LOWBW_MODEL = "@cf/meta/llama-3.1-8b-instruct"
SUMMARIZE_MODEL = "@cf/meta/llama-3.1-8b-instruct"
CODE_MODEL = "@cf/deepseek-ai/deepseek-r1-distill-qwen-32b"
TRANSLATE_MODEL = "@cf/meta/m2m100-1.2b"
TRANSLATE_MODEL_M2M = "@cf/meta/m2m100-1.2b"
EMBEDDING_MODEL = "@cf/baai/bge-large-en-v1.5"
# Paystack (cards / bank / USSD / Mobile Money / QR / bank transfer).
# - PAYSTACK_SECRET_KEY is set via `wrangler secret put PAYSTACK_SECRET_KEY`
#   and is INTENTIONALLY NOT declared here — Cloudflare rejects a binding
#   name that exists in both [vars] and as a secret. When the secret is
#   unset, /api/payments/intent returns a friendly "payments_unconfigured"
#   503 instead of a 5xx, so the desktop widget shows a "coming soon"
#   message.
# - PAYSTACK_PUBLIC_KEY can stay in [vars] (safe to embed) once we wire
#   it into the frontend. Same one-binding-name rule applies: don't
#   simultaneously set it as a secret.
# - PAYSTACK_BASE_URL is overridable for tests + sandbox.
PAYSTACK_PUBLIC_KEY = ""
PAYSTACK_BASE_URL = "https://api.paystack.co"

[triggers]
crons = ["0 3 * * *"]

[env.production]
name = "baobab-api"
routes = [{ pattern = "api.baobab.africa/*", zone_name = "baobab.africa" }]

[env.production.vars]
ENVIRONMENT = "production"
CORS_ORIGIN = "https://baobab.africa,https://app.baobab.africa,tauri://localhost"
APP_NAME = "Baobab"
APP_VERSION = "1.0.0"
DEFAULT_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
LOWBW_MODEL = "@cf/meta/llama-3.1-8b-instruct"
SUMMARIZE_MODEL = "@cf/meta/llama-3.1-8b-instruct"
CODE_MODEL = "@cf/deepseek-ai/deepseek-r1-distill-qwen-32b"
TRANSLATE_MODEL = "@cf/meta/m2m100-1.2b"
EMBEDDING_MODEL = "@cf/baai/bge-large-en-v1.5"
